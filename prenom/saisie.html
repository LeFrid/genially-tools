<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saisie du prénom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .bloc {
      width: min(90%, 520px);
      padding: 28px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-size: 26px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid #222;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    #confirmation {
      min-height: 24px;
      margin-top: 14px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="bloc">
    <label for="prenom">Quel est votre prénom ?</label>

    <input
      id="prenom"
      type="text"
      placeholder="Saisissez votre prénom"
      autocomplete="given-name"
      maxlength="40"
    >

    <button id="valider" type="button">Valider</button>

    <div id="confirmation" aria-live="polite"></div>
  </div>

<script src="../js/gt-core.js"></script>

<script>
  const champPrenom = document.getElementById("prenom");
  const boutonValider = document.getElementById("valider");
  const confirmation = document.getElementById("confirmation");

  function enregistrerPrenom() {
    const prenom = champPrenom.value.trim();

    if (!prenom) {
      confirmation.textContent = "Merci de saisir votre prénom.";
      return;
    }

    GT.set("prenom", prenom.trim());
    confirmation.textContent = "Prénom enregistré : " + GT.get("prenom");
  }

  boutonValider.addEventListener("click", enregistrerPrenom);

  champPrenom.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      enregistrerPrenom();
    }
  });
</script>

</body>
</html>
