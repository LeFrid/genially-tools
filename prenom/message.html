<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message</title>

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
    background:transparent;
}

#message{
    font-size:42px;
    font-weight:bold;
    text-align:center;
    color:#000;
}

.nom{
    color:#0057B8;
}

</style>

</head>

<body>

<div id="message"></div>
    
<script src="../js/gt-core.js"></script>
    
<script>
    
  const zoneMessage = document.getElementById("message");

  function afficherPrenom() {
    const prenom = GT.get("prenom");

    if (prenom) {
      zoneMessage.innerHTML =
        "Bienvenue dans cette mission <span class='nom'>" +
        prenom.toUpperCase() +
        "</span>";
    } else {
      zoneMessage.textContent = "Bienvenue dans cette mission";
    }
  }

  // Affichage au chargement
  afficherPrenom();

  // Mise à jour lorsque la variable change
  window.addEventListener("storage", function(event) {
    if (event.key === "GT_prenom") {
      afficherPrenom();
    }
  });

  // Sécurité pour le fonctionnement dans les iframes Genially
  setInterval(afficherPrenom, 500);
    
</script>

</body>
</html>
