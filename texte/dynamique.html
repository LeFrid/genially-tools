<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GT - Texte dynamique</title>

    <script src="../js/gt-core.js"></script>

    <style>

        html,
        body{
            --gt-variable-color:#0057B8;
            margin:0;
            padding:0;
            width:100%;
            height:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            font-family:Arial, sans-serif;
            background:transparent;

        }

        #texte{

                text-align:center;
                line-height:1.3;
                white-space:pre-wrap;
                font-size:42px;
        }

       .variable{

            font-weight:bold;
            color:var(--gt-variable-color);

        }

    </style>

</head>

<body>

    <div id="texte" data-gt-render></div>
    
<script>
    
    const {
    text = "Bienvenue dans cette mission {prenom}",
    size = "42",
    color = "000000",
    font = "Arial",
    variableColor = "0057B8"
    } = GT.params();

    const zoneTexte = document.getElementById("texte");

    zoneTexte.innerHTML = text;
    zoneTexte.style.fontSize = size + "px";
    zoneTexte.style.color = "#" + color;
    zoneTexte.style.fontFamily = font;

    document.documentElement.style.setProperty(
    "--gt-variable-color",
    "#" + variableColor
);

    GT.autoRender();

</script>
    
</body>

</html>
