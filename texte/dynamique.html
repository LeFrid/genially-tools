<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GT - Texte dynamique</title>

    <script src="../js/gt-core.js"></script>

    <style>

        html,
        body{
            --gt-variable-color:#0057B8;
            margin:0;
            padding:0;
            width:100%;
            height:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            font-family:Arial, sans-serif;
            background:transparent;

        }

        #texte{

                text-align:center;
                line-height:1.3;
                white-space:pre-wrap;
                font-size:42px;
        }

       .variable{

            font-weight:bold;
            color:var(--gt-variable-color);

        }

    </style>

</head>

<body>

    <div id="texte" data-gt-render></div>
    
<script>

    const {
        text = "Bienvenue dans cette mission {prenom}",
        fontsize = "42",
        color = "#000000",
        font = "Arial",
        fontweight = "400",
        align = "center",
        vcolor = "#0057B8"
    } = GT.params();

    const zoneTexte = document.getElementById("texte");

    function normaliserCouleur(value, fallback) {

        if (!value) {
            return fallback;
        }

        const couleur = value.trim();

        if (
            /^[0-9a-fA-F]{3}$/.test(couleur) ||
            /^[0-9a-fA-F]{6}$/.test(couleur) ||
            /^[0-9a-fA-F]{8}$/.test(couleur)
        ) {
            return "#" + couleur;
        }

        return couleur;
    }

    function normaliserTaille(value) {

        const taille = String(value).trim();

        if (/^\d+(\.\d+)?$/.test(taille)) {
            return taille + "px";
        }

        return taille;
    }

    zoneTexte.innerHTML = text;
    zoneTexte.style.fontSize = normaliserTaille(fontsize);
    zoneTexte.style.color = normaliserCouleur(color, "#000000");
    zoneTexte.style.fontFamily = font;
    zoneTexte.style.fontWeight = fontweight;
    zoneTexte.style.textAlign = align;

    document.documentElement.style.setProperty(
        "--gt-variable-color",
        normaliserCouleur(vcolor, "#0057B8")
    );

    GT.autoRender();

</script>
    
</body>

</html>
